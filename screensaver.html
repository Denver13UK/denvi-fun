<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100d1d">
<title>Denvi Float — Screensaver</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d1d}#scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 45% 45%,#291b40,#0b0912 75%)}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}#shade{position:absolute;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(135deg,#120b2420,#08061120)}.floater{position:absolute;left:0;top:0;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;will-change:transform;filter:drop-shadow(0 7px 12px #0005)}#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cbbbe7;font:14px/1.5 system-ui,sans-serif;padding:24px}#message div{max-width:320px}#message .star{font-size:42px;margin-bottom:12px;color:#c7a8ff}#message h1{font-size:20px;color:#f5efff;margin:0 0 8px}#message p{font-size:12px;margin:0;color:#a99aba}.hidden{display:none!important}
</style>
</head>
<body>
<main id="scene"><img id="bg" alt="" hidden><div id="shade"></div><div id="message"><div><div class="star">✦</div><h1>Preparing your screensaver…</h1><p>Getting your characters ready to float.</p></div></div></main>
<script>
(()=>{'use strict';
const scene=document.getElementById('scene'),bg=document.getElementById('bg'),message=document.getElementById('message');
let cfg=null,instances=[],raf=0,last=0;
const readyTimer=setInterval(()=>{if(!cfg&&window.opener)window.opener.postMessage('DENVI_FLOAT_READY',location.origin);else clearInterval(readyTimer)},200);
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='DENVI_FLOAT_SETUP'||cfg)return;cfg=e.data;start()});
function rand(a,b){return a+Math.random()*(b-a)}
function start(){
 clearInterval(readyTimer);
 const s=cfg.settings||{},chars=(cfg.characters||[]).filter(c=>c.sprites&&c.sprites.length);
 if(!chars.length){message.innerHTML='<div><div class="star">✦</div><h1>No characters found</h1><p>Go back to Denvi Float and add character images.</p></div>';return}
 if(cfg.background){bg.src=cfg.background;bg.hidden=false;bg.style.objectFit=s.bgFit||'cover'}
 message.classList.add('hidden');
 const count=Math.max(1,Math.min(40,Number(s.amount)||12)),baseSize=Math.max(28,Math.min(180,Number(s.size)||88)),speed=Math.max(1,Math.min(10,Number(s.speed)||3)),spin=Math.max(0,Math.min(10,Number(s.spin)||3));
 for(let n=0;n<count;n++){
  const c=chars[Math.floor(Math.random()*chars.length)],el=document.createElement('img');el.className='floater';el.alt='';el.draggable=false;
  const depth=Math.random(),size=baseSize*(.58+depth*.65),a=rand(0,Math.PI*2);
  const i={el,c,idx:Math.floor(Math.random()*c.sprites.length),x:rand(0,Math.max(0,innerWidth-size)),y:rand(0,Math.max(0,innerHeight-size)),vx:Math.cos(a),vy:Math.sin(a),angle:rand(0,360),dir:Math.random()<.5?-1:1,depth,size,phase:rand(0,Math.PI*2),switchAt:performance.now()+1000+Math.random()*800};
  el.src=c.sprites[i.idx];el.style.width=size+'px';el.style.height=size+'px';el.style.zIndex=String(Math.floor(depth*10));el.style.opacity=String(.42+depth*.58);
  if(depth<.35&&s.backTint!==false)el.style.filter='brightness(.48) sepia(.25) saturate(1.7) hue-rotate(215deg) drop-shadow(0 5px 10px #0006)';
  scene.appendChild(el);instances.push(i);
 }
 last=performance.now();raf=requestAnimationFrame(tick);
}
function tick(now){const dt=Math.min((now-last)/16.67||1,3);last=now;const w=innerWidth,h=innerHeight;
 for(const i of instances){
  if(now>=i.switchAt){if(i.c.sprites.length>1){let next=i.idx;for(let tries=0;next===i.idx&&tries<5;tries++)next=Math.floor(Math.random()*i.c.sprites.length);i.idx=next;i.el.src=i.c.sprites[next]}i.switchAt=now+1000}
  const drift=.25+Math.sin(now*.00025+i.phase)*.14;i.x+=i.vx*speed*.105*drift*dt;i.y+=i.vy*speed*.105*drift*dt;
  if(safeBounce()){if(i.x<0){i.x=0;i.vx=Math.abs(i.vx)}if(i.y<0){i.y=0;i.vy=Math.abs(i.vy)}if(i.x+i.size>w){i.x=Math.max(0,w-i.size);i.vx=-Math.abs(i.vx)}if(i.y+i.size>h){i.y=Math.max(0,h-i.size);i.vy=-Math.abs(i.vy)}}else{if(i.x<-i.size)i.x=w;if(i.x>w)i.x=-i.size;if(i.y<-i.size)i.y=h;if(i.y>h)i.y=-i.size}
  i.angle+=spin*.09*i.dir*dt;i.el.style.transform='translate3d('+i.x+'px,'+i.y+'px,0) rotate('+i.angle+'deg)';
 }
 raf=requestAnimationFrame(tick);
}
function safeBounce(){return (cfg.settings||{}).edgeBounce!==false}
window.addEventListener('resize',()=>{for(const i of instances){i.x=Math.min(i.x,Math.max(0,innerWidth-i.size));i.y=Math.min(i.y,Math.max(0,innerHeight-i.size))}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);raf=0}else if(!document.hidden&&cfg&&instances.length&&!raf){last=performance.now();raf=requestAnimationFrame(tick)}});
})();
</script>
</body>
</html>
