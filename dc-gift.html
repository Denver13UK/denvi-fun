<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Gift</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #313338;
    color: #ffffff;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(88, 101, 242, 0.25),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #1e1f22,
            #313338 55%,
            #232428
        );
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;

    opacity: 0.12;

    background-image:
        radial-gradient(
            circle,
            #5865f2 1px,
            transparent 1px
        );

    background-size: 45px 45px;
}

/* =========================
   DISCORD LOGO
========================= */

.discord-logo {
    position: fixed;
    top: 38px;
    left: 45px;

    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.discord-logo-icon {
    width: 34px;
    height: 27px;

    background: #ffffff;

    border-radius: 45% 45% 40% 40%;

    position: relative;
}

.discord-logo-icon::before,
.discord-logo-icon::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    background: #313338;

    border-radius: 50%;

    top: 10px;
}

.discord-logo-icon::before {
    left: 8px;
}

.discord-logo-icon::after {
    right: 8px;
}

/* =========================
   CARD
========================= */

.card {
    width: min(480px, calc(100vw - 32px));

    background: #2b2d31;

    border-radius: 8px;

    padding: 42px 40px 38px;

    text-align: center;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35);
}

/* =========================
   DISCORD ICON
========================= */

.card-discord-icon {
    width: 46px;
    height: 36px;

    background: #ffffff;

    border-radius: 45%;

    margin: 0 auto 25px;

    position: relative;
}

.card-discord-icon::before,
.card-discord-icon::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    background: #2b2d31;

    border-radius: 50%;

    top: 13px;
}

.card-discord-icon::before {
    left: 11px;
}

.card-discord-icon::after {
    right: 11px;
}

/* =========================
   GIFT IMAGE
========================= */

.gift-icon {
    width: 100px;
    height: 100px;

    margin: 0 auto 28px;

    border-radius: 22px;

    background: #5865f2;

    overflow: hidden;

    box-shadow:
        0 8px 20px rgba(88, 101, 242, 0.25);
}

.gift-icon img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* =========================
   TEXT
========================= */

h1 {
    margin: 0;

    font-size: 25px;
    line-height: 1.3;

    font-weight: 700;
}

.gift-name {
    margin-top: 8px;

    font-size: 17px;

    color: #b5bac1;
}

.gift-name strong {
    color: #ffffff;

    font-weight: 600;
}

/* =========================
   BUTTON
========================= */

.accept-button {
    width: 100%;
    height: 48px;

    margin-top: 28px;

    border: 0;
    border-radius: 3px;

    background: #5865f2;

    color: #ffffff;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.1s ease;
}

.accept-button:hover {
    background: #4752c4;
}

.accept-button:active {
    transform: translateY(1px);
}

/* =========================
   CLAIMED TEXT
========================= */

.claimed {
    margin-top: 18px;

    color: #b5bac1;

    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .discord-logo {
        top: 22px;
        left: 22px;

        font-size: 19px;
    }

    .card {
        padding: 35px 25px 30px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<!-- Discord-style logo -->
<div class="discord-logo">
    <div class="discord-logo-icon"></div>
    <span>Discord</span>
</div>

<!-- Gift card -->
<div class="card">

    <div class="card-discord-icon"></div>

    <!-- Image comes from ?image= -->
    <div class="gift-icon">
        <img
            id="giftImage"
            src=""
            alt=""
        >
    </div>

    <h1>You've been gifted</h1>

    <!-- Name comes from ?name= -->
    <div class="gift-name">
        <strong id="giftName">Nerd</strong>
    </div>

    <button
        id="acceptButton"
        class="accept-button"
    >
        Woo! Accept Gift
    </button>

    <div
        id="claimedText"
        class="claimed"
    >
        This gift has already been claimed.
    </div>

</div>

<script>
/*
    URL PARAMETERS
    ================================

    ?name=Nerd

    ?image=https://example.com/image.png

    ?claimed=false

    Example:

    https://your-site.com/?name=Nerd&image=https%3A%2F%2Fexample.com%2Fnerd.png

    Example with unclaimed gift:

    https://your-site.com/?name=Nerd&image=https%3A%2F%2Fexample.com%2Fnerd.png&claimed=false
*/

const params = new URLSearchParams(window.location.search);

/* =========================
   NAME
========================= */

const name = params.get("name");

if (name && name.trim() !== "") {
    document.getElementById("giftName").textContent = name;
}

/* =========================
   IMAGE
========================= */

const image = params.get("image");

const giftImage = document.getElementById("giftImage");

if (image && image.trim() !== "") {

    giftImage.src = image;

} else {

    /*
        Default image if no ?image= is provided.
    */

    giftImage.src =
        "https://cdn.discordapp.com/embed/avatars/0.png";
}

/* =========================
   CLAIMED / UNCLAIMED
========================= */

const claimed = params.get("claimed");

const claimedText =
    document.getElementById("claimedText");

const acceptButton =
    document.getElementById("acceptButton");

if (claimed === "false") {

    claimedText.style.display = "none";

    acceptButton.disabled = false;

} else {

    /*
        Default state:
        gift is already claimed.
    */

    acceptButton.disabled = true;
}

/* =========================
   ACCEPT BUTTON
========================= */

acceptButton.addEventListener("click", function () {

    if (claimed === "false") {

        alert("Gift accepted!");

    }

});
</script>

</body>
</html>
