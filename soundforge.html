<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoundForge — Multitrack Audio Editor</title>
<style>
:root{color-scheme:dark;--bg:#111218;--panel:#1b1d27;--line:#343746;--muted:#a4a8ba;--purple:#a28aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4fa;font:14px system-ui, sans-serif}button,input{font:inherit}button{background:#292c39;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--purple)}.primary{background:var(--purple);color:#171124;font-weight:700}.top,.transport,.bottom{display:flex;gap:9px;align-items:center;padding:12px 16px;background:#171820;border-bottom:1px solid var(--line);flex-wrap:wrap}.logo{font-size:18px;font-weight:850}.logo span{color:var(--purple)}.spacer{flex:1}.layout{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 130px)}aside{padding:14px;border-right:1px solid var(--line)}aside button{width:100%;margin:4px 0}.drop{border:1px dashed #64677c;border-radius:10px;text-align:center;padding:18px 8px;margin-bottom:12px;color:var(--muted)}.assets{margin-top:15px}.asset{background:#262936;padding:8px;margin:5px 0;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}.main{min-width:0}.transport{position:sticky;top:0;z-index:5}.clock{font-variant-numeric:tabular-nums;color:#ddd}.timelineWrap{overflow:auto;max-height:calc(100vh - 190px);min-height:360px}.timeline{position:relative;min-width:850px}.rulerRow,.track{display:flex}.rulerRow{height:36px;position:sticky;top:0;z-index:3;background:#191b24;border-bottom:1px solid var(--line)}.label{width:150px;min-width:150px;padding:10px;border-right:1px solid var(--line);background:#191b24}.ruler{position:relative;height:36px;background-image:linear-gradient(to right,#383b4a 1px,transparent 1px)}.tick{position:absolute;top:8px;color:#b5b7c6;font-size:10px}.track{min-height:88px;border-bottom:1px solid #292c38}.trackLabel{width:150px;min-width:150px;padding:9px;border-right:1px solid var(--line);background:#191b24}.trackName{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:7px}.trackLabel button{font-size:10px;padding:3px 5px;margin:0 3px 0 0}.lane{position:relative;min-height:88px;background-image:linear-gradient(to right,#292c38 1px,transparent 1px)}.clip{position:absolute;top:8px;height:70px;border:1px solid #ffffff55;border-radius:7px;overflow:hidden;min-width:20px;cursor:grab}.clip.sel{outline:2px solid white}.clip strong{display:block;font-size:11px;padding:4px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative;z-index:1}.wave{position:absolute;left:0;top:22px;width:100%;height:44px;pointer-events:none}.handle{position:absolute;top:0;bottom:0;width:7px;background:#ffffff80;cursor:ew-resize;z-index:2}.left{left:0}.right{right:0}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff5978;pointer-events:none;z-index:4}.status{color:#73e1b1;font-size:12px}.bottom{border-top:1px solid var(--line);border-bottom:0;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.assets{display:none}.label,.trackLabel{width:115px;min-width:115px}}
</style>
<div class="top"><div class="logo">◉ <span>Sound</span>Forge</div><span style="color:var(--muted)">Multitrack audio editor</span><div class="spacer"></div><button id="save">Save project</button><button id="open">Open project</button><input id="projectFile" type="file" accept=".json" hidden><button class="primary" id="export">Export MP3</button></div>
<div class="layout"><aside><div class="drop" id="drop"><b>＋ Import audio</b><br><small>Drop audio files here</small></div><input id="files" type="file" accept="audio/*" multiple hidden><button class="primary" id="import">＋ Import audio</button><button id="newTrack">＋ Add track</button><div class="assets"><b>Imported audio</b><div id="assets"></div></div><p style="font-size:12px;color:var(--muted)">Drag a clip to move it. Drag its edges to trim. Click the timeline to move the playhead.</p></aside>
<div class="main"><div class="transport"><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="split">✂ Split</button><button id="delete">Delete clip</button><span class="clock" id="clock">00:00 / 00:00</span><div class="spacer"></div><label>Zoom <input id="zoom" type="range" min="30" max="160" value="80"></label><button id="fit">Fit</button></div><div class="timelineWrap" id="wrap"><div class="timeline" id="timeline"><div class="rulerRow"><div class="label">Tracks</div><div class="ruler" id="ruler"></div></div><div id="tracks"></div><div class="playhead" id="head"></div></div></div><div class="bottom"><span class="status" id="status">Ready — import audio to begin.</span></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), colors=['#6d60d7','#168d7d','#bd5d86','#bb8534','#377eb7','#875bb0','#568d4c'];let tracks=[],assets=[],selected=null,head=0,zoom=80,playing=false,ctx=null,raf=0,playStart=0,playFrom=0,sources=[];
const say=s=>$('status').textContent=s, fmt=n=>{n=Math.max(0,n||0);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function track(name){let t={id:crypto.randomUUID(),name:name||'Track '+(tracks.length+1),muted:false,clips:[]};tracks.push(t);return t}
function duration(){return Math.max(10,...tracks.flatMap(t=>t.clips.map(c=>c.start+c.duration)))}
function findClip(id){for(let t of tracks){let c=t.clips.find(c=>c.id===id);if(c)return {t,c}}return null}
function asset(id){return assets.find(a=>a.id===id)}
function wave(cv,a,c){let x=cv.getContext('2d'),w=cv.width=Math.max(1,cv.clientWidth*devicePixelRatio),h=cv.height=Math.max(1,cv.clientHeight*devicePixelRatio);x.clearRect(0,0,w,h);if(!a)return;let d=a.buffer.getChannelData(0),mid=h/2,step=Math.max(1,Math.floor((c.duration*a.buffer.sampleRate)/w));x.fillStyle='#ffffffbd';for(let px=0;px<w;px++){let i=Math.min(d.length-1,Math.floor((c.offset+px/w*c.duration)*a.buffer.sampleRate)),lo=1,hi=-1;for(let j=0;j<step&&i+j<d.length;j++){lo=Math.min(lo,d[i+j]);hi=Math.max(hi,d[i+j])}x.fillRect(px,mid+lo*h*.42,1,Math.max(1,(hi-lo)*h*.42))}}
function render(){let dur=duration(),w=Math.ceil(dur*zoom+30);$('timeline').style.width=150+w+'px';$('ruler').style.width=w+'px';$('ruler').style.backgroundSize=zoom+'px 100%';$('ruler').innerHTML='';for(let i=0;i<=dur;i++){let s=document.createElement('span');s.className='tick';s.style.left=i*zoom+5+'px';s.textContent=fmt(i);$('ruler').append(s)}$('tracks').innerHTML='';tracks.forEach((t,ti)=>{let row=document.createElement('div');row.className='track';let lab=document.createElement('div');lab.className='trackLabel';lab.innerHTML='<div class="trackName">'+esc(t.name)+'</div><button data-a="mute">'+(t.muted?'Unmute':'Mute')+'</button><button data-a="rename">Name</button><button data-a="remove">×</button>';lab.querySelector('[data-a=mute]').onclick=()=>{t.muted=!t.muted;render()};lab.querySelector('[data-a=rename]').onclick=()=>{let n=prompt('Track name',t.name);if(n){t.name=n;render()}};lab.querySelector('[data-a=remove]').onclick=()=>{if(confirm('Delete track and its clips?')){tracks=tracks.filter(x=>x!==t);if(!tracks.length)track();render()}};row.append(lab);let lane=document.createElement('div');lane.className='lane';lane.style.width=w+'px';lane.style.backgroundSize=zoom+'px 100%';lane.onclick=e=>{if(e.target===lane){head=Math.max(0,(e.clientX-lane.getBoundingClientRect().left)/zoom);paintHead()}};lane.ondragover=e=>e.preventDefault();lane.ondrop=e=>{e.preventDefault();let a=asset(e.dataTransfer.getData('asset'));if(a)addClip(t,a,Math.max(0,(e.clientX-lane.getBoundingClientRect().left)/zoom))};t.clips.forEach(c=>{let a=asset(c.asset),el=document.createElement('div');el.className='clip'+(c.id===selected?' sel':'');el.style.left=c.start*zoom+'px';el.style.width=Math.max(20,c.duration*zoom)+'px';el.style.background=colors[ti%colors.length];el.innerHTML='<strong>'+esc(c.name)+'</strong><canvas class="wave"></canvas><i class="handle left"></i><i class="handle right"></i>';requestAnimationFrame(()=>wave(el.querySelector('canvas'),a,c));el.onclick=e=>{e.stopPropagation();selected=c.id;render()};el.onpointerdown=e=>{if(e.target.classList.contains('handle'))return;selected=c.id;drag={id:c.id,type:'move',x:e.clientX,start:c.start};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!drag||drag.id!==c.id)return;let d=(e.clientX-drag.x)/zoom;if(drag.type==='move'){c.start=Math.max(0,drag.start+d);el.style.left=c.start*zoom+'px'}else if(drag.type==='left'){let change=Math.max(-drag.offset,Math.min(drag.duration-.05,d));c.start=drag.start+change;c.offset=drag.offset+change;c.duration=drag.duration-change;el.style.left=c.start*zoom+'px';el.style.width=Math.max(20,c.duration*zoom)+'px'}else{c.duration=Math.max(.05,Math.min((a?.duration||999)-drag.offset,drag.duration+d));el.style.width=Math.max(20,c.duration*zoom)+'px'}};el.onpointerup=()=>{if(drag?.id===c.id){drag=null;render()}};el.querySelector('.left').onpointerdown=e=>{e.stopPropagation();e.preventDefault();selected=c.id;drag={id:c.id,type:'left',x:e.clientX,start:c.start,offset:c.offset,duration:c.duration};el.setPointerCapture(e.pointerId)};el.querySelector('.right').onpointerdown=e=>{e.stopPropagation();e.preventDefault();selected=c.id;drag={id:c.id,type:'right',x:e.clientX,offset:c.offset,duration:c.duration};el.setPointerCapture(e.pointerId)};lane.append(el)});row.append(lane);$('tracks').append(row)});$('head').style.left=150+head*zoom+'px';$('head').style.height=36+tracks.length*88+'px';$('clock').textContent=fmt(head)+' / '+fmt(dur)}
let drag=null;function paintHead(){$('head').style.left=150+head*zoom+'px';$('clock').textContent=fmt(head)+' / '+fmt(duration())}
function addClip(t,a,start=0){let c={id:crypto.randomUUID(),asset:a.id,name:a.name,start,duration:a.duration,offset:0};t.clips.push(c);selected=c.id;render();say('Added '+a.name)}
async function importFiles(list){for(let f of list){if(!f.type.startsWith('audio/'))continue;try{ctx=ctx||new AudioContext();let buffer=await ctx.decodeAudioData(await f.arrayBuffer()),a={id:crypto.randomUUID(),name:f.name,duration:buffer.duration,buffer};assets.push(a);addClip(tracks[0]||track(),a);let el=document.createElement('div');el.className='asset';el.textContent='♪ '+f.name;el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData('asset',a.id);el.onclick=()=>addClip(tracks[0]||track(),a);$('assets').append(el)}catch(e){say('Could not read '+f.name+' — try MP3 or WAV.')}}}
$('import').onclick=()=>$('files').click();$('drop').onclick=()=>$('files').click();$('files').onchange=e=>importFiles(e.target.files);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();importFiles(e.dataTransfer.files)};$('newTrack').onclick=()=>{track();render()};$('zoom').oninput=e=>{zoom=+e.target.value;render()};$('fit').onclick=()=>{zoom=Math.max(30,Math.min(160,Math.floor(($('wrap').clientWidth-180)/duration())));$('zoom').value=zoom;render()};
$('split').onclick=()=>{let f=findClip(selected);if(!f)return say('Select a clip first.');let c=f.c,cut=head-c.start;if(cut<.05||cut>c.duration-.05)return say('Put the playhead inside the selected clip first.');f.t.clips.push({...c,id:crypto.randomUUID(),start:head,offset:c.offset+cut,duration:c.duration-cut});c.duration=cut;render();say('Clip split')};$('delete').onclick=()=>{let f=findClip(selected);if(!f)return say('Select a clip first.');f.t.clips=f.t.clips.filter(c=>c.id!==selected);selected=null;render();say('Clip deleted')};
function stop(){playing=false;cancelAnimationFrame(raf);sources.forEach(s=>{try{s.stop()}catch{}});sources=[];$('play').textContent='▶ Play'}
function play(){if(playing){stop();return}ctx=ctx||new AudioContext();ctx.resume();playing=true;playFrom=head;playStart=ctx.currentTime;$('play').textContent='Ⅱ Pause';for(let t of tracks)if(!t.muted)for(let c of t.clips){let a=asset(c.asset);if(!a||c.start+c.duration<=head)continue;let skip=Math.max(0,head-c.start),s=ctx.createBufferSource();s.buffer=a.buffer;s.connect(ctx.destination);s.start(ctx.currentTime+Math.max(0,c.start-head),c.offset+skip,c.duration-skip);sources.push(s)}function tick(){if(!playing)return;head=playFrom+ctx.currentTime-playStart;if(head>=duration()){head=0;stop()}paintHead();raf=requestAnimationFrame(tick)}tick()}
$('play').onclick=play;$('stop').onclick=()=>{stop();head=0;paintHead()};
$('save').onclick=()=>{let data={version:1,zoom,tracks:tracks.map(t=>({...t,clips:t.clips.map(c=>({...c}))})),assets:assets.map(a=>({id:a.id,name:a.name,duration:a.duration}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='soundforge-project.json';a.click();URL.revokeObjectURL(a.href);say('Arrangement saved. Keep audio files to restore it.')};
$('open').onclick=()=>$('projectFile').click();$('projectFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());alert('For this version, import your audio files first. The project can restore clips whose audio IDs match this session.');tracks=d.tracks||[];zoom=d.zoom||80;$('zoom').value=zoom;render()}catch{say('Invalid project file')}};
$('export').onclick=async()=>{if(!assets.length)return say('Import audio before exporting.');$('export').disabled=true;say('Rendering mix…');try{let sr=44100,off=new OfflineAudioContext(2,Math.ceil(duration()*sr),sr);for(let t of tracks)if(!t.muted)for(let c of t.clips){let a=asset(c.asset);if(!a)continue;let s=off.createBufferSource();s.buffer=a.buffer;s.connect(off.destination);s.start(c.start,c.offset,c.duration)}let out=await off.startRendering();if(!window.lamejs)await new Promise((res,rej)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';s.onload=res;s.onerror=rej;document.head.append(s)});let enc=new lamejs.Mp3Encoder(2,sr,192),L=out.getChannelData(0),R=out.getChannelData(1),parts=[];for(let i=0;i<L.length;i+=1152){let l=new Int16Array(Math.min(1152,L.length-i)),r=new Int16Array(l.length);for(let j=0;j<l.length;j++){l[j]=Math.max(-32768,Math.min(32767,L[i+j]*32767));r[j]=Math.max(-32768,Math.min(32767,R[i+j]*32767))}let b=enc.encodeBuffer(l,r);if(b.length)parts.push(new Uint8Array(b));if(i%115200===0)await new Promise(res=>setTimeout(res,0))}let last=enc.flush();if(last.length)parts.push(new Uint8Array(last));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type:'audio/mpeg'}));a.download='soundforge-mix.mp3';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);say('MP3 export complete!')}catch(e){console.error(e);say('Export failed. Ensure you are online so the MP3 encoder can load.')}finally{$('export').disabled=false}};
track('Track 1');render();
})();
</script>
